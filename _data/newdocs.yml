# Pages superseded by the Breeze 3 client docs and the Breeze .NET Server 8 docs.
#
# `redirect` maps a page's source path to the page that replaces it. Those pages jump straight
# there; a reader who opens one with ?v2 stays on these docs, and keeps staying until they click
# "Always go to the new docs" in the banner (see _includes/newdocs-redirect.html).
#
# Every page in a `banner` section (or listed there by path) shows the "there are new docs" banner, redirected or not.

client: /breeze-client-v3/
server: /breeze-server-v3/

banner:
  doc-js:   client
  doc-net:  server
  doc-main/index.md: client

redirect:
  # BreezeJS (breeze-client 2.x) -> breeze-client 3
  doc-js/index.md:                              /breeze-client-v3/
